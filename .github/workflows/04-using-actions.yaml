name: 04 - Using Actions

on: push

jobs:
    build:
        runs-on: windows-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7
            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                node-version: '24.x'
                cache: npm
            - name: Install Dependencies
              working-directory: 04-using-actions/react-app
              run: npm ci
            