name: 04 - Using Actions

on: push

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7
            - name: Printing Folders
              run: |
                sudo apt-get update && sudo apt-get install -y tree
                tree -I '.git' # Prints the structure, ignoring the hidden .git folder
            